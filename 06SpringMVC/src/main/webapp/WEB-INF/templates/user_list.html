<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户列表</title>
    <link rel="stylesheet" th:href="@{/static/user.css}" type="text/css"></link>
</head>
<body>
<div class="header">
    <h1>用户列表</h1>
</div>
<div class="add-button-wrapper">
    <a class="add-button" th:href="@{/user/add}">新增用户</a>
</div>
<table>
    <thead>
    <tr>
        <th>编号</th>
        <th>用户名</th>
        <th>性别</th>
        <th>邮箱</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user:${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.name}"></td>
        <td th:text="${user.gender==1?'男':'女'}"></td>
        <td th:text="${user.email}"></td>
        <td>
            <a th:href="@{'/user/modify/'+${user.id}}">修改</a>
            <a th:href="@{'/user/delete/'+${user.id}}" onclick="del(event)">删除</a>
        </td>
    </tr>
    </tbody>

    <script>
        function del(event) {
            // 阻止超链接的默认行为
            event.preventDefault();

            //发送DELETE请求。
            if (confirm("您确定要删除数据吗?")) {
                //提交表单
                let userForm = document.querySelector("#userForm");
                // 设置userForm的action属性。
                userForm.action = event.target.href;
                //提交表单
                userForm.submit();
            }
        }
    </script>

    <!--准备一个表单form-->
    <form method="post" id="userForm">
        <input type="hidden" name="_method" value="delete">
    </form>

</table>
</body>
</html>
