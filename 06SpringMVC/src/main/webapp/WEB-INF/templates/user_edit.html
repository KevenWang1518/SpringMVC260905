<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改用户</title>
    <link rel="stylesheet" th:href="@{/static/user.css}" type="text/css"></link>
</head>
<body>
<h1>修改用户</h1>
<form th:action="@{/user/modify}" th:object="${user}" method="post">

    <!--隐藏域决定采用put请求提交-->
    <input type="hidden" name="_method" value="put">
    <!--隐藏id，提交id-->
    <input type="hidden" name="id" th:value="*{id}">

    <label>用户名:</label>
    <input type="text" name="name" th:value="*{name}" required>

    <label>性别:</label>
    <!--th:field的作用:将值取出，然后拿着值和每一个选项的value进行比较，如果相等，则该选项被选中。-->
    <select name="gender" th:field="*{gender}" required>
        <option value="">-- 请选择 --</option>
        <option value="1" selected>男</option>
        <option value="0">女</option>
    </select>

    <label>邮箱:</label>
    <input type="email" name="email" th:value="*{email}" required>

    <button type="submit">修改</button>
</form>
</body>
</html>
